name: dis_saucisse_desktop
description: "Dis Saucisse ! desktop app: receive and store photos sent by the phone."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  core:
    path: ../../core/core
  core_ui:
    path: ../../core/core_ui
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^8.2.0
  go_router: ^16.3.0
  transfer_protocol:
    path: ../../shared_packages/transfer_protocol

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
