name: dis_saucisse_desktop
description: "Dis Saucisse ! desktop app: receive and store photos sent by the phone."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  core:
    path: ../../core/core
  core_ui:
    path: ../../core/core_ui
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^8.2.0
  go_router: ^17.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  shelf: ^1.4.3
  transfer_protocol:
    path: ../../shared_packages/transfer_protocol

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
