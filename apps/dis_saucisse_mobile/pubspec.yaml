name: dis_saucisse_mobile
description: "Dis Saucisse ! mobile app: sort photos and send them to the computer."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  core:
    path: ../../core/core
  core_ui:
    path: ../../core/core_ui
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^8.2.0
  go_router: ^17.0.0
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.6
  transfer_protocol:
    path: ../../shared_packages/transfer_protocol
  zxing2: ^0.2.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
