name: dis_saucisse_mobile
description: "Dis Saucisse ! mobile app: sort photos and send them to the computer."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  bonsoir: ^7.1.4
  core:
    path: ../../core/core
  core_ui:
    path: ../../core/core_ui
  crypto: ^3.0.8
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  fpdart: ^1.2.0
  get_it: ^8.2.0
  go_router: ^17.0.0
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.6
  transfer_protocol:
    path: ../../shared_packages/transfer_protocol
  zxing2: ^0.2.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#FFD23F"
  image: res/splash/logo_splash.png
  android_12:
    color: "#FFD23F"
    image: res/splash/logo_splash_android12.png
  web: false

flutter_launcher_icons:
  ios: true
  image_path_ios: res/icon/icon_ios.png
  remove_alpha_ios: true
  android: true
  image_path_android: res/icon/icon_ios.png
  adaptive_icon_background: "#FFD23F"
  adaptive_icon_foreground: res/icon/icon_android_foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 26
