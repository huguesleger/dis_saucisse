name: dis_saucisse_mobile
description: "Dis Saucisse ! mobile app: sort photos and send them to the computer."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  core:
    path: ../../core/core
  core_ui:
    path: ../../core/core_ui
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^8.2.0
  go_router: ^17.0.0
  transfer_protocol:
    path: ../../shared_packages/transfer_protocol

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
