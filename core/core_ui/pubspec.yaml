name: core_ui
description: Dis Saucisse design system (colors, typography, components).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  lottie: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
